[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-housing-intelligence"
version = "0.1.0"
description = "A data platform for analysing NYC property complaints and housing violations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0"
]

[tool.setuptools.packages.find]
where = ["src"]